# 1. Workflow Name: A human-readable name that appears in the GitHub Actions tab.
name: Release VS Code Extension

# 2. Trigger Event: This workflow runs when a new Git tag is pushed.
# The tag patterns are designed to match semantic versioning conventions,
# including optional pre-release identifiers (e.g., 1.0.0, v1.0.0-beta.1).
on:
  push:
    branches:
      - main # Triggers on every push to the main branch

# 3. Jobs: A workflow is composed of one or more jobs. This workflow has a single job named "release".
jobs:
  release:
    # 4. Runner Environment: Specifies the type of virtual machine the job will run on.
    runs-on: ubuntu-latest # Uses the latest Ubuntu Linux runner.

    # 5. Permissions: Explicitly grant necessary permissions to the GITHUB_TOKEN.
    # 'contents: write' is crucial for creating a release and uploading assets (your VSIX file).
    permissions:
      contents: write

    # 6. Steps: A job contains a sequence of steps that are executed in order.
    steps:
      # Step 1: Checkout your repository code.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Automated Versioning and Tagging
      # This determines the next version based on commit messages (feat:, fix:, chore:, etc.)
      - name: Bump version and push tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

      # Step 3: Sync package.json version with the new tag
      - name: Sync package.json version
        working-directory: extension/
        run: |
          NEW_VERSION=${{ steps.tag_version.outputs.new_tag }}
          # Strip the 'v' prefix for npm version
          npm version ${NEW_VERSION#v} --no-git-tag-version

      # Step 4: Set up Node.js environment.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Specifies Node.js version 20 (an LTS version) to meet dependency requirements.
          # You could also use '22' or 'lts/*' for the latest LTS.
          node-version: '20' # <--- CHANGE THIS FROM '18' TO '20'
          cache: 'npm'
          cache-dependency-path: 'extension/package-lock.json'

      # Step 5: Install dependencies and Compile TypeScript.
      - name: Install dependencies and Compile TypeScript
        working-directory: extension/
        run: |
          npm install
          npm run compile

      # Step 6: Package the VS Code extension into a .vsix file.
      - name: Package VS Code Extension (VSIX)
        working-directory: extension/
        run: npx vsce package

      # Step 7: Create a GitHub Release and attach the VSIX.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: |
            Automated Release for version ${{ steps.tag_version.outputs.new_tag }}
            
            Commits since last release included in the notes below.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: 'extension/*.vsix'