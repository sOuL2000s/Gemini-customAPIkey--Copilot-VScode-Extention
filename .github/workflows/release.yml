# 1. Workflow Name: A human-readable name that appears in the GitHub Actions tab.
name: Release VS Code Extension

# 2. Trigger Event: This workflow runs when a new Git tag is pushed.
# The tag patterns are designed to match semantic versioning conventions,
# including optional pre-release identifiers (e.g., 1.0.0, v1.0.0-beta.1).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'   # Matches tags like "1.2.3", "1.2.3-beta", etc.
      - 'v[0-9]+.[0-9]+.[0-9]+*' # Matches tags like "v1.2.3", "v1.2.3-rc.1", etc.

# 3. Jobs: A workflow is composed of one or more jobs. This workflow has a single job named "release".
jobs:
  release:
    # 4. Runner Environment: Specifies the type of virtual machine the job will run on.
    runs-on: ubuntu-latest # Uses the latest Ubuntu Linux runner.

    # 5. Permissions: Explicitly grant necessary permissions to the GITHUB_TOKEN.
    # 'contents: write' is crucial for creating a release and uploading assets (your VSIX file).
    permissions:
      contents: write

    # 6. Steps: A job contains a sequence of steps that are executed in order.
    steps:
      # Step 1: Checkout your repository code.
      # This checks out the entire 'GEMINI-LOCAL-CODER' repository.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 'fetch-depth: 0' ensures the entire Git history is fetched.
          # This is necessary for 'generate_release_notes: true' to compare commits
          # between tags and create proper release descriptions.
          fetch-depth: 0

      # Step 2: Set up Node.js environment.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Specifies Node.js version 20 (an LTS version) to meet dependency requirements.
          # You could also use '22' or 'lts/*' for the latest LTS.
          node-version: '20' # <--- CHANGE THIS FROM '18' TO '20'
          cache: 'npm'
          cache-dependency-path: 'extension/package-lock.json'

      # Step 3: Install dependencies and Compile TypeScript.
      # The 'working-directory' option ensures these commands run within the 'extension' folder.
      - name: Install dependencies and Compile TypeScript
        working-directory: extension/ # <--- IMPORTANT CHANGE HERE
        run: |
          npm install
          npm run compile # This runs the 'tsc -p ./' command defined in your package.json

      # Step 4: Package the VS Code extension into a .vsix file.
      # The 'working-directory' option ensures this command also runs within the 'extension' folder.
      # The .vsix file will be created inside 'extension/'.
      - name: Package VS Code Extension (VSIX)
        working-directory: extension/ # <--- IMPORTANT CHANGE HERE
        run: npx vsce package # This command creates the .vsix file.

      # Step 5: Create a GitHub Release and attach the VSIX.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-pre') }}
          generate_release_notes: true
          # The 'files' path must now be relative to the repository root
          # to find the .vsix file generated within the 'extension/' folder.
          files: 'extension/*.vsix' # <--- IMPORTANT CHANGE HERE